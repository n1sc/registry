name: Index

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/build_index.py"
      - ".github/workflows/index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolves each package's tags with `git ls-remote`, so no checkout of
      # the package repositories is needed.
      - name: Build index
        run: python3 scripts/build_index.py

      - name: Commit the index
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild index"
          git push
