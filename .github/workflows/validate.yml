name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Schema checks only: tag discovery needs the network and runs after
      # merge, so a pull request never fails because a tag list was slow.
      - name: Validate package files
        run: python3 scripts/build_index.py --validate-only
